name: Test and build Windows
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Fetch pinned OCR models
        run: python scripts/fetch_ocr.py
      - name: Tests
        run: python -m pytest -q
      - name: Build executable
        run: python -m PyInstaller --noconfirm SmartPDF.spec
      - name: Build installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $compiler installer/SmartPDF.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $compiler /DUpdateOnly installer/SmartPDF.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: SmartPDF-Windows-x64
          path: dist/installer/*.exe
          retention-days: 14
